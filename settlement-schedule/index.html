<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>정산·스케줄 관리</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;font-family:system-ui;color:#475569}.box{text-align:center}.spin{width:34px;height:34px;margin:0 auto 14px;border:4px solid #e2e8f0;border-top-color:#64748b;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style>
</head>
<body><div class="box"><div class="spin"></div><b>정산 프로그램을 불러오는 중...</b></div>
<script>
(async function(){
  try{
    const names=Array.from({length:15},(_,i)=>'app.part.'+String(i).padStart(2,'0'));
    const parts=await Promise.all(names.map(n=>fetch(n+'?v=20261012b').then(r=>{if(!r.ok)throw new Error(n);return r.text()})));
    document.open();document.write(parts.join(''));document.close();
  }catch(e){document.body.innerHTML='<div class="box"><b>파일을 불러오지 못했습니다.</b><p>인터넷 연결을 확인한 뒤 새로고침해주세요.</p></div>';console.error(e)}
})();
</script></body></html>
